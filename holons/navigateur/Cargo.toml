[package]
name = "hln-navigateur"
version.workspace = true
edition.workspace = true
license.workspace = true

# The web browser as a holon: WebAssembly for the system's interpreter
# (wasm32-unknown-unknown, integers only), the browser of `hln-browser`
# in its window. With the `network` feature (the default) it also imports
# `hln.fetch`, which the system gives a holon holding the `network` right;
# without it (`--no-default-features`) it imports only `hln.log`,
# `hln.present` and `hln.input`, and its pages say the network is not
# there.
[lib]
crate-type = ["cdylib"]
test = false
bench = false

[features]
default = ["network"]
network = []

[dependencies]
hln-browser = { path = "../../crates/browser" }
hln-web = { path = "../../crates/web" }

[lints]
workspace = true
