[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The development tasks: the browser's faces, the bench that renders pages
# to PNG, the holon's build and checks. Runs on the developer's machine
# only, so it may use crates the holon never does.
[dependencies]
hln-web = { path = "../crates/web" }
hln-browser = { path = "../crates/browser" }


ttf-parser = "0.25.1"
ab_glyph_rasterizer = "0.1.10"

[lints]
workspace = true
